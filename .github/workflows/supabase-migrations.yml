name: Validate Supabase migrations

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "tools/test_supabase_migrations.sh"
      - ".github/workflows/supabase-migrations.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "tools/test_supabase_migrations.sh"
      - ".github/workflows/supabase-migrations.yml"

jobs:
  migration-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: esquina_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d esquina_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/esquina_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Validate all migrations and signup flow on disposable PostgreSQL
        run: bash tools/test_supabase_migrations.sh
