name: Validate Esquina Mix auth
on:
  push:
    branches:
      - main
      - feature/supabase-auth-esquina-mix
      - feature/growth-ux-conversion-2026-11-17
  pull_request:
    branches:
      - main
jobs:
  auth-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check patch whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check origin/main...HEAD
          else
            git diff --check HEAD^ HEAD
          fi
      - name: Run auth static and unit checks
        run: node tools/test_auth.js
