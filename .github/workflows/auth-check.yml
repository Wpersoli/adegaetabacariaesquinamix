name: Validate Esquina Mix auth
on:
  push:
    branches:
      - main
      - feature/supabase-auth-esquina-mix
      - feature/growth-ux-conversion-2026-11-17
  pull_request:
    branches:
      - main
jobs:
  auth-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check patch whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check origin/main...HEAD
          else
            git diff --check HEAD^ HEAD
          fi
      - name: Run auth static and unit checks
        run: node tools/test_auth.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Validate service worker syntax
        run: node --check sw.js
      - name: Run responsive browser checks
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/esquina-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          node tools/validar_responsivo.js http://127.0.0.1:8080
          node tools/validar_produtos_responsivo.js http://127.0.0.1:8080
          node tools/test_pwa_offline.js http://127.0.0.1:8080
